# picom.conf — Framework 13 (2880x1920@120Hz + external) + i3
# Built from your baseline slide 0.20, now with safe, preset-first tweaks
# and a custom workspace micro-pop. Solid wallpaper keeps it cheap to composite.
# Restart: pkill picom; picom -b --config ~/.config/picom/picom.conf

# No WM-specific patches needed (i3)
wm-support = "none";

#################################
#         ANIMATIONS            #
#################################

# Top-level animations — what i3 workspace switching actually uses (show/hide)
# plus new-window open/close and tiled reflow (geometry).
# Preset slide is the rock-solid C path; custom hide/show adds a tiny scale
# so workspaces pop a bit without grid shimmer (ghostty stays opaque).

animations = (
{
	# i3 tiling reflow (splits, resizes, moves) — stock preset, smooth
	triggers = [ "geometry" ];
	preset = "geometry-change";
	duration = 0.20;
},
{
	# New window close — slide-out right, full-width, no scale/fade
	triggers = [ "close" ];
	preset = "slide-out";
	direction = "right";
	duration = 0.20;
},
{
	# Workspace hide — inverse of firefox/ghostty open (1 -> 0.6) for symmetry
	# Try 0.22 snappy (ghostty speed) or 0.50 for exact firefox mirror
	triggers = [ "hide" ];
	opacity = {
		curve = "cubic-bezier(0,1,1,1)";
		duration = 0.22;
		start = "window-raw-opacity-before";
		end = 0;
	};
	blur-opacity = "opacity";
	shadow-opacity = "opacity";
	scale-x = {
		curve = "cubic-bezier(0,1.1,1,1)";
		duration = 0.22;
		start = 1;
		end = 0.6;
	};
	scale-y = "scale-x";
	offset-x = "(1 - scale-x) / 2 * window-width";
	offset-y = "(1 - scale-y) / 2 * window-height";
	shadow-scale-x = "scale-x";
	shadow-scale-y = "scale-y";
	shadow-offset-x = "offset-x";
	shadow-offset-y = "offset-y";
},
{
	# New window open — preset slide-in left, no pop (per-app ghostty/firefox override this)
	triggers = [ "open" ];
	preset = "slide-in";
	direction = "left";
	duration = 0.20;
},
{
	# Workspace show — diagonal: less horizontal, more vertical + 5% micro-pop
	# Slightly more vertical (up) and less horizontal so desktop hop feels less like a shove
	triggers = [ "show" ];
	tmp-show-slide = {
		curve = "cubic-bezier(0.22, 1, 0.36, 1)";
		duration = 0.55;
		# was -0.70, now 50% horizontal — less shove, more like open center-zoom
		start = "window-width * -0.50";
		end = 0;
	};
	tmp-show-slide-y = {
		curve = "cubic-bezier(0.22, 1, 0.36, 1)";
		duration = 0.55;
		# more vertical — starts lower, moves up, like open pop
		start = "window-height * 0.10";
		end = 0;
	};
	scale-x = {
		curve = "cubic-bezier(0.22, 1, 0.36, 1)";
		duration = 0.55;
		start = 0.78;
		end = 1;
	};
	scale-y = "scale-x";
	offset-x = "(1 - scale-x) / 2 * window-width + tmp-show-slide";
	offset-y = "(1 - scale-y) / 2 * window-height + tmp-show-slide-y";
	shadow-scale-x = "scale-x";
	shadow-scale-y = "scale-y";
	shadow-offset-x = "offset-x";
	shadow-offset-y = "offset-y";
}
);

# Per-app animations — preset-first for stability, custom only where you wanted wow.
# Terminals avoid 0.6 scale to prevent grid shimmer; browsers can pop bigger.

rules = (

	# Terminals — snappy slide, no zoom (keeps dense text crisp)
	{ match = "class_g = 'Alacritty'"; animations = (
		{ triggers = [ "open" ]; preset = "slide-in"; direction = "left"; duration = 0.16; },
		{ triggers = [ "close" ]; preset = "slide-out"; direction = "right"; duration = 0.14; },
	)},

	# Browsers — fly has a softer arc than slide; close now fly-out right
	{ match = "class_g = 'Brave-browser'"; animations = (
		{ triggers = [ "open" ]; preset = "fly-in"; direction = "left"; duration = 0.24; },
		{ triggers = [ "close" ]; preset = "fly-out"; direction = "right"; duration = 0.18; },
	)},

	# Firefox — wow pop from codeberg (0.6→1) with 1.1 overshoot, faster now
	{ match = "class_g = 'firefox'"; animations = (
		{ triggers = [ "open" ];
		  opacity = { curve = "cubic-bezier(0,1,1,1)"; duration = 0.5; start = 0; end = "window-raw-opacity"; };
		  blur-opacity = "opacity"; shadow-opacity = "opacity";
		  scale-x = { curve = "cubic-bezier(0,1.1,1,1)"; duration = 0.5; start = 0.6; end = 1; };
		  scale-y = "scale-x";
		  offset-x = "(1 - scale-x) / 2 * window-width"; offset-y = "(1 - scale-y) / 2 * window-height";
		  shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y"; shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
		},
		# back to default instant fade
		{ triggers = [ "close" ]; preset = "disappear"; scale = 1.0; duration = 0.05; },
	)},

	{ match = "class_g = 'Chromium-browser'"; animations = (
		{ triggers = [ "open" ]; preset = "fly-in"; direction = "left"; duration = 0.24; },
		{ triggers = [ "close" ]; preset = "fly-out"; direction = "right"; duration = 0.18; },
	)},

	# Discord — mirror right→right so external monitor exit feels natural (not up/down into bezel)
	{ match = "class_g = 'discord'"; animations = (
		{ triggers = [ "open" ]; preset = "slide-in"; direction = "right"; duration = 0.20; },
		{ triggers = [ "close" ]; preset = "slide-out"; direction = "right"; duration = 0.18; },
	)},

	{ match = "class_g = 'i3lock'"; animations = (
		{ triggers = [ "open" ]; preset = "appear"; scale = 0.75; duration = 0.20; },
		{ triggers = [ "close" ]; preset = "disappear"; scale = 0.75; duration = 0.20; },
	)},

	{ match = "class_g = 'kitty'"; animations = (
		{ triggers = [ "open" ]; preset = "slide-in"; direction = "left"; duration = 0.16; },
		{ triggers = [ "close" ]; preset = "slide-out"; direction = "right"; duration = 0.14; },
	)},

	# Ghostty — same wow pop as firefox but faster (0.22/0.18) so terminal feels snappier than browser
	{ match = "class_g = 'com.mitchellh.ghostty'"; animations = (
		{ triggers = [ "open" ];
		  opacity = { curve = "cubic-bezier(0,1,1,1)"; duration = 0.22; start = 0; end = "window-raw-opacity"; };
		  blur-opacity = "opacity"; shadow-opacity = "opacity";
		  scale-x = { curve = "cubic-bezier(0,1.1,1,1)"; duration = 0.22; start = 0.6; end = 1; };
		  scale-y = "scale-x";
		  offset-x = "(1 - scale-x) / 2 * window-width"; offset-y = "(1 - scale-y) / 2 * window-height";
		  shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y"; shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
		},
		{ triggers = [ "close" ];
		  opacity = { curve = "cubic-bezier(0,1,1,1)"; duration = 0.18; start = "window-raw-opacity-before"; end = 0; };
		  blur-opacity = "opacity"; shadow-opacity = "opacity";
		  scale-x = { curve = "cubic-bezier(0,1.1,1,1)"; duration = 0.18; start = 1; end = 0.6; };
		  scale-y = "scale-x";
		  offset-x = "(1 - scale-x) / 2 * window-width"; offset-y = "(1 - scale-y) / 2 * window-height";
		  shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y"; shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
		},
	)},

	# Rofi — spotlight from top, a touch faster than dunst so they feel layered
	{ match = "class_i = 'rofi'"; opacity = 1.0; shadow = true; full-shadow = true; corner-radius = 20; animations = (
		{ triggers = [ "open" ]; preset = "slide-in"; direction = "up"; duration = 0.12; },
		{ triggers = [ "close" ]; preset = "slide-out"; direction = "up"; duration = 0.20; },
	)},

	# Dunst — top-drop like rofi, solid wallpaper keeps it cheap
	{ match = "class_g *?= 'dunst'"; opacity = 1.0; shadow = true; full-shadow = true; corner-radius = 12; animations = (
		{ triggers = [ "open", "show" ]; preset = "slide-in"; direction = "up"; duration = 0.20; },
		{ triggers = [ "close", "hide" ]; preset = "slide-out"; direction = "up"; duration = 0.20; },
	)},

	{ match = "class_g = 'Zathura'"; animations = (
		{ triggers = [ "open" ]; preset = "fly-in"; direction = "right"; duration = 0.20; },
		{ triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.05; },
	)},

	# Small popups/menus — subtle appear, no slide, so they don't compete with workspace
	{ match = "window_type = 'menu'"; opacity = 1.0; shadow = false; animations = (
		{ triggers = [ "open", "show" ]; preset = "appear"; duration = 0.10; },
		{ triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.10; },
	)},
	{ match = "window_type = 'toolbar'"; opacity = 1.0; shadow = false; animations = (
		{ triggers = [ "open", "show" ]; preset = "appear"; duration = 0.10; },
		{ triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.10; },
	)},
	{ match = "window_type = 'tooltip'"; opacity = 1.0; shadow = false; animations = (
		{ triggers = [ "open", "show" ]; preset = "appear"; duration = 0.10; },
		{ triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.10; },
	)},
	{ match = "window_type = 'combo'"; opacity = 1.0; shadow = false; animations = (
		{ triggers = [ "open", "show" ]; preset = "appear"; duration = 0.10; },
		{ triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.10; },
	)},
	{ match = "window_type = 'splash'"; opacity = 1.0; shadow = false; animations = (
		{ triggers = [ "open", "show" ]; preset = "appear"; duration = 0.10; },
		{ triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.10; },
	)},
	{ match = "window_type = 'popup_menu'"; opacity = 1.0; shadow = false; animations = (
		{ triggers = [ "open", "show" ]; preset = "appear"; duration = 0.10; },
		{ triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.10; },
	)},
	{ match = "window_type = 'dropdown_menu'"; opacity = 1.0; shadow = false; animations = (
		{ triggers = [ "open", "show" ]; preset = "appear"; duration = 0.10; },
		{ triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.10; },
	)},
	{ match = "window_type = 'utility'"; opacity = 1.0; shadow = false; animations = (
		{ triggers = [ "open", "show" ]; preset = "appear"; duration = 0.10; },
		{ triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.10; },
	)},

	# No animation for docks/screenshot tools — instant
	{ match = "window_type = 'dock'"; opacity = 1.0; shadow = false; corner-radius = 0; animations = (
		{ triggers = [ "open", "show" ]; preset = "appear"; duration = 0; },
	)},
	{ match = "class_g = 'maim'"; opacity = 1.0; shadow = false; corner-radius = 0; animations = (
		{ triggers = [ "open", "show", "close", "hide" ]; preset = "appear"; duration = 0; },
	)},
	{ match = "class_g = 'slop'"; opacity = 1.0; shadow = false; corner-radius = 0; animations = (
		{ triggers = [ "open", "show", "close", "hide" ]; preset = "appear"; duration = 0; },
	)},
)

#################################
#           Corners             #
#################################

# auto-detect rounded windows
detect-rounded-corners = true;
# global rounding, per-app overrides above (rofi 20, dunst 12)
corner-radius = 10;

#################################
#             Shadows           #
#################################

shadow = true;
# onedark bg #1c1c1c → slightly darker shadow, not pure black
shadow-color = "#151515";
# softness — 14 was bloomier, 10 is crisp on 2880
shadow-radius = 10;
# -8 was deeper lift, -6 is subtle
shadow-offset-x = -6;
shadow-offset-y = -6;

#################################
#           Fading              #
#################################

# fallback for opacity changes
fading = true;
detect-client-opacity = true;

#################################
#     Background-Blurring       #
#################################

# you vetoed frost — keep sharp
blur-background = false;

#################################
#       General Settings        #
#################################

# glx > egl on Framework 120Hz — egl is experimental and tore on right edge
backend = "glx";
# lock to vblank, essential for slide
vsync = true;
# true = cheap partial redraw; false = full redraw (fixes flicker but 100% CPU)
use-damage = true;
# sync X draws before composite — helps tear
xrender-sync-fence = true;
# keep compositing even fullscreen (no unredirect flash)
unredir-if-possible = false;
log-level = "info";
