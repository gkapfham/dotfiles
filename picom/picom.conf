# picom.conf configuration file that contains settings
# for the newest animations and transitions

# Enables patches for specific window managers;
# Currently patched: "awesome", "dwm", "herb"
wm-support = "none";

#################################
#         ANIMATIONS            #
#################################

# Default animations

animations = (
{
 	triggers = [ "geometry" ];
 	preset = "geometry-change";
 	duration = 0.20;
},
{
  triggers = [ "close" ];
  preset = "slide-out";
  direction = "right";
  duration = 0.20;
},
{
  triggers = [ "hide" ];
  preset = "slide-out";
  direction = "right";
  duration = 0.20;
},
{
  triggers = [ "open" ];
  preset = "slide-in";
  direction = "left";
  duration = 0.30;
},
{
  triggers = [ "show" ];
  preset = "slide-in";
  direction = "left";
  duration = 0.30;
}
);

# Application-specific animations

rules = (

        { match = "class_g = 'Alacritty'"; animations = (
                { triggers = [ "open" ];
                  preset = "slide-in";
                  direction = "left";
                  duration = 0.20;
                },
                { triggers = [ "close" ];
                  preset = "disappear";
                  scale = 0.5;
                  duration = 0.05;
                },
                )
        },

        { match = "class_g = 'Brave-browser'"; animations = (
                { triggers = [ "open" ];
                  preset = "slide-in";
                  direction = "left";
                  duration = 0.20;
                },
                { 
                  triggers = [ "close" ];
                  preset = "disappear";
                  scale = 1.0;
                  duration = 0.05;
                },
                )
        },

        { match = "class_g = 'discord'"; animations = (
                { triggers = [ "open" ];
                  preset = "slide-in";
                  direction = "left";
                  duration = 0.20;
                },
                { 
                  triggers = [ "close" ];
                  preset = "disappear";
                  scale = 1.0;
                  duration = 0.05;
                },
                )
        },

        { match = "class_g = 'kitty'"; animations = (
                { triggers = [ "open" ];
                  preset = "slide-in";
                  direction = "left";
                  duration = 0.20;
                },
                )
        },

        { match = "class_i = 'rofi'"; animations = (
                { triggers = [ "open" ];
                  preset = "slide-in";
                  direction = "up";
                  duration = 0.15;
                },
                { triggers = [ "close" ];
                  preset = "slide-out";
                  direction = "up";
                  duration = 0.20;
                },
                )
        },

        { match = "class_g = 'Zathura'"; animations = (
                { triggers = [ "open" ];
                  preset = "slide-in";
                  direction = "left";
                  duration = 0.20;
                },
                { triggers = [ "close", "hide" ];
                  preset = "disappear";
                  duration = 0.05;
                },
                )
        },

        { match = "window_type = 'menu'";
                opacity = 1.0; shadow = false; animations = (
                { triggers = [ "open", "show" ];
                  preset = "appear";
                  duration = 0.10;
                },
                { triggers = [ "close", "hide" ];
                  preset = "disappear";
                  duration = 0.10;
                },
                )
        },

        { 
          match = "window_type = 'dock'";
          opacity = 1.0;
          shadow = false;
          corner-radius = 0;
          animations = (
           {
             triggers = [ "open", "show" ];
             preset = "appear";
             duration = 0;
           }
          )
        },


        { 
          match = "class_g = 'maim'";
          opacity = 1.0;
          shadow = false;
          corner-radius = 0;
          animations = (
           {
             triggers = [ "open", "show", "close", "hide" ];
             preset = "appear";
             duration = 0;
           }
          )
        },

        { 
          match = "class_g = 'slop'";
          opacity = 1.0;
          shadow = false;
          corner-radius = 0;
          animations = (
           {
             triggers = [ "open", "show", "close", "hide" ];
             preset = "appear";
             duration = 0;
           }
          )
        },

)

#################################
#           Corners             #
#################################

# Automatically detect rounded corners
detect-rounded-corners = true;

# Adjusts the window corner rounding in pixels.
corner-radius = 10;

#################################
#             Shadows           #
#################################

# Enabled client-side shadows on windows. Note desktop windows
# (windows with '_NET_WM_WINDOW_TYPE_DESKTOP') never get shadow,
# unless explicitly requested using the wintypes option.
shadow = true;

# The blur radius for shadows, in pixels. (defaults to 16)
shadow-radius = 20;

# The left offset for shadows, in pixels. (defaults to -15)
shadow-offset-x = -15;

# The top offset for shadows, in pixels. (defaults to -15)
shadow-offset-y = -15;

#################################
#           Fading              #
#################################

# Fade windows in/out when opening/closing and when opacity changes,
# unless no-fading-openclose is used
fading = true;

#################################
#   Transparency / Opacity      #
#################################

# Automatically detect client-side opacity
detect-client-opacity = true;

#################################
#     Background-Blurring       #
#################################

# Blur background of windows
blur-background = false;

#################################
#       General Settings        #
#################################

# Use the OpenGL backend for rendering
backend = "glx";

# Enable/disable VSync
vsync = true;

# Use damage information to minimize paint area
use-damage = true;

# Sync to X drawing updates to avoid tearing
# xrender-sync-fence = true;

# Unredirect fullscreen windows to improve performance
# unredir-if-possible = false;

# Define the logging level
log-level = "info";
