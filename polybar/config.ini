[colors]
; Define colors to be centered by dark grey
; Some of these colors are not used now
background = #1c1c1c
background-alt = #c6c6c6
foreground = #a8a8af
foreground-alt = #a8a8af
primary = #444444
secondary = #e60053
alert = #616161
green = #009300
yellow = #E95420
red = #f90000
blue = #0a6cf5

; Define all of the configuration details for
; the "mybar" polybar custom-designed for display
; at the top of the screen for a polybar that 
; runs on a Framework 13 laptop with the 2.2K
; screen that has the rounded corners

[bar/mybar]
; Define format for mybar
monitor = ${env:MONITOR:}
width = 100%
height = 40
fixed-center = true

; Set the two basic colors
background = ${colors.background}
foreground = ${colors.foreground}

; Make the lines the same as background
line-size = 3
line-color = ${colors.background}
border-size = 0

; Don't use padding by default
padding-left = 0
padding-right = 0

; Set 1 unit of margin by default
module-margin-left = 1
module-margin-right = 1
module-margin-center = 1

; Specify the main font
font-0 = "Maple Mono NF:size=20:weight=bold;5"

; Specify the icon font
font-1 = "Maple Mono NF:size=20;5"

; Specify the emphasis font for the i3 workspaces
font-2 = "Maple Mono NF:size=20:weight=bold;5"

; Left panel: display the i3 workspaces
modules-left = i3

; Middle panel: display the wireless network, battery, cpu, temperature, memory, and filesystem
modules-center = wireless-network battery cpu temperature memory filesystem

; Right panel: display the backlight, pulseaudio, and date
modules-right = backlight pulseaudio date

; Allow the mouse to click and scroll
cursor-click = pointer
cursor-scroll = ns-resize

; Specify some global redraw settings
[settings]
screenchange-reload = true

; Specify some global margin settings
[global/wm]
margin-top = 5
margin-bottom = 5

; Display details about the wired network;
; note that this is not yet configured
; correctly to work with the new wired network
[module/wired-network]
type = internal/network
interface = enp6s0
interval = 5.0
udspeed-minwidth = 0
format-connected-prefix = " "
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected =  %upspeed:8% %downspeed:8%

; Display details about the wireless network
[module/wireless-network]
type = internal/network
interface = wlp1s0
interval = 5.0
udspeed-minwidth = 0
format-connected-prefix = ""
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected =   %essid% 󰒢 %signal:2%
label-packetloss =   %essid% %signal:2% %upspeed:9% %downspeed:9%

; Display the i3 workspaces; note that the
; spacing in the format prefix and the icon
; ensures that the existence of the rounded
; corners in the screen are not readily apparent
[module/i3]
type = internal/i3
format = <label-state><label-mode>
format-prefix = "   "
index-sort = true
wrapping-scroll = true
enable-click = true
pin-workspaces = true
strip-wsnumbers = true

; Configure the display of the mode indicator
label-mode = %mode%
label-mode-padding = 1
label-mode-margin-left = 2
label-mode-margin-right = 1
label-mode-foreground = ${colors.foreground}
label-mode-background = ${colors.primary}

; Focused = Active workspace on focused monitor
; This expands to give the full name of the workspace
; Using a separate process will dynamically adjust
; these names depending on the program currently in use
label-focused = %name%
label-focused-font = 3
label-focused-background = ${colors.primary}
label-focused-underline= ${colors.primary}
label-focused-foreground = ${colors.background-alt}
label-focused-padding = 1

; Unfocused = Inactive workspace on any monitor
label-unfocused = %name%
label-unfocused-padding = 1

; Visible = Active workspace on unfocused monitor
label-visible = %name%
label-visible-background = ${self.label-focused-background}
label-visible-underline = ${self.label-focused-underline}
label-visible-padding = ${self.label-focused-padding}

; Urgent = Workspace with urgency hint set
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

; Display the use of the processor
[module/cpu]
type = internal/cpu
interval = 10
format-prefix = " "
format-underline = ${colors.background}
label = %percentage:2%%

; Display the temperature of the processor
[module/temperature]
type = internal/temperature
interval = 10
thermal-zone = 0
format-prefix = " "
hwmon-path = /sys/class/hwmon/hwmon0/temp1_input
format = <label>
label = %temperature-c:2%

; Display the use of the memory
[module/memory]
type = internal/memory
interval = 10
format-prefix = ""
format-underline = ${colors.background}
label = 󱙋 %gb_used% of 󱤟 %gb_total%
; label = 󱙋 %gb_used% 󰪩 %gb_free% 󱤟 %gb_total%

; Display details about the filesystem
[module/filesystem]
type = internal/fs
mount-0 = /
format-mounted = <label-mounted>
label-mounted = 󰋊 %mountpoint%: %percentage_used%% of %total%

; Display the date
[module/date]
type = internal/date
interval = 500
date =  %a %b %d
time = "%I:%M %p "
label = %date% %time%
format = <label>
format-underline = ${colors.background}

; Display the level of the audio
[module/pulseaudio]
type = internal/pulseaudio
sink = alsa_output.pci-0000_c1_00.6.pro-output-0

format-volume = <label-volume>
label-volume =  %percentage:3%%
label-volume-foreground = ${root.foreground}
format-volume-underline = ${colors.background}

format-muted-prefix = "󰝟 "
label-muted = %percentage:2%%
format-muted-underline = ${colors.background}

; Display the level of the battery
[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 100
time-format = %H:%M

label-charging = %percentage:3%% 󰥔 %time%  %consumption%
format-charging-prefix = "󰁹"
format-charging = <label-charging>
format-charging-underline = ${colors.background}

label-discharging = %percentage:3%% 󰥔 %time%  %consumption%
format-discharging-prefix = "󰁹"
format-discharging = <label-discharging>
format-discharging-underline = ${colors.background}

label-full = %percentage:3%%
format-full-prefix = "󰁹 "
format-full-underline = ${colors.background}

; Display backlight details
; Note that this works even though i3 uses light
[module/backlight]
type = internal/backlight
card = amdgpu_bl1
format = <ramp> <label>
format-prefix = ""
label = %percentage:3%%

ramp-4 = 󰃠
ramp-3 = 󰃝
ramp-2 = 󰃟
ramp-1 = 󰃟
ramp-0 = 󰃞
