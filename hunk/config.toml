# ─────────────────────────────────────────────────────────────────────────────
# hunk/config.toml — hunk diff viewer (https://hunk.dev), stowed to
# ~/.config/hunk/config.toml. Run `hunk` however you like (bunx, npx, brew):
# it always reads this file, so `bunx hunkdiff diff` gets the theme too.
#
# NOTE: hunk rewrites this file when it persists view preferences (S = save
# view preferences, or picking a theme with `t`). Because the path is a stow
# symlink, such a write lands in this repository: check
# `git -C ~/configure/dotfiles status hunk/` if the theme ever changes itself.
#
# THEME "vitaminonec"
#   Built from theme/palette.toml — the same orange/blue palette used by
#   ghostty, onedarkpro (nvim), pi and opencode — so a diff looks like the
#   rest of the desktop:
#       background #1c1c1c   text #e0e0e0   accent orange #d78700
#       comments #808080     keywords/functions purple #a569a5
#       strings yellow       types/constants orange     variables blue
#       operators cyan       tags red                  added green
#
#   Numeric choices come from two rules of thumb:
#   · Hunk draws syntax over tinted diff rows, so a row is the background
#     blended only 12% toward its role and a changed span 18%; that keeps the
#     dimmest syntax roles (purple, comment grey) above 3.3:1 contrast.
#   · Chrome text (muted, badges) needs 4.5:1 against panel and panel-alt,
#     so "muted" is the palette white rather than the comment grey.
#
#   The syntax table below re-maps every scope selector that the base theme
#   (github-dark) styles, plus the roles neovim paints via treesitter, plus the
#   grammar-specific selectors that would otherwise fall back to plain text
#   (555 scopes). No base-theme hue (GitHub green/blue/pink) can leak through in
#   a language nobody remembered to check: anything still unmatched falls back
#   to the "source" default #e0e0e0.
#
#   Background: transparent_background = true below, so hunk's chrome and the
#   empty parts of the review stream show the terminal's own #1c1c1c (ghostty
#   and zellij both use #1c1c1c). Grey (#2d2d2d / #262626) is reserved for
#   accents: separators, the selected row or menu entry, and note cards.
# ─────────────────────────────────────────────────────────────────────────────

theme = "vitaminonec"

# Let the terminal background show through hunk's chrome. Ghostty, zellij and
# the palette all use #1c1c1c, so this is what makes hunk sit on the same black
# as the rest of the desktop instead of a grey #262626 panel.
transparent_background = true

# The preferences hunk had already persisted in ~/.config/hunk/config.toml
# before this file was stowed, carried over unchanged. Hunk rewrites these
# lines when you save view preferences; the theme table below is preserved.
mode = "auto"
line_numbers = true
wrap_lines = false
hunk_headers = true
menu_bar = true
agent_notes = true
copy_decorations = false
cursor_line = "row"

[themes.vitaminonec]
base = "github-dark"
label = "Vitaminonec"

# chrome. With transparent_background above, the terminal's own #1c1c1c shows
# through panel/panelAlt; the values here are the fallback if it is turned off.
# Grey is an accent (separators, selection, note cards), never a large fill.
background = "#1c1c1c"
panel = "#1c1c1c" # files pane / review stream
panelAlt = "#1c1c1c" # menu bar / status line
border = "#2d2d2d" # separators: dim, so the full-width rule stays quiet
text = "#e0e0e0"
muted = "#b2b2b2" # secondary labels (needs 4.5:1 on panelAlt)
accent = "#d78700" # active controls, focus
accentMuted = "#2d2d2d" # selected row / menu entry: grey accent

# diff rows and changed spans
contextBg = "#1c1c1c"
contextContentBg = "#1c1c1c"
addedBg = "#262b19"
removedBg = "#322321"
addedContentBg = "#2b3217"
removedContentBg = "#3e2624"
movedAddedBg = "#2f2f23"
movedRemovedBg = "#2f2f23"
addedSignColor = "#6f9500"
removedSignColor = "#d75347"

# gutters and hunk selection
lineNumberBg = "#1c1c1c"
lineNumberFg = "#808080"
selectedHunk = "#4b3715"

# badges and file status
badgeAdded = "#6f9500"
badgeRemoved = "#d75347"
badgeNeutral = "#b2b2b2"
fileNew = "#6f9500"
fileDeleted = "#d75347"
fileRenamed = "#a569a5"
fileModified = "#d78700"
fileUntracked = "#00afaf"

# agent note cards
noteBorder = "#a569a5"
noteBackground = "#262626"
noteTitleBackground = "#2d2d2d"
noteTitleText = "#d78700"

